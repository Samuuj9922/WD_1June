<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Navbar</title>
    <link rel="stylesheet" href="./Amazon.css">
</head>
<body>

    <nav>
        <div class="logo">
            Amazon.in
        </div>

        <div class="location">
            <small>Deliver to</small>
            <p>India</p>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search Amazon">
            <button>🔍</button>
        </div>

        <div class="account">
            <small>Hello, Sign in</small>
            <p>Account & Lists</p>
        </div>

        <div class="orders">
            <small>Returns</small>
            <p>& Orders</p>
        </div>

        <div class="cart">
            🛒 Cart
        </div>
    </nav>

</body>
</html>
