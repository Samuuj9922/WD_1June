<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <!-- carousel -->

    <section class="carousel slide" data-bs-ride="carousel" id="demo">

        <div class="carousel-indicators">
    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
  </div>


        <div class="carousel-inner">
            <div class="carousel-item active">
            <img src="./woman-8894656_1280.jpg" alt="" height="880px" width="100%">
            <div class="carousel-caption">
                <h2>Coming soon</h2>
            </div>
        </div>
        


        <div class="carousel-item">
            <img src="./istockphoto-1381637603-2048x2048.jpg" alt="" height="880px" width="100%">
            <div class="carousel-caption">
                <h2>Watch Now</h2>
            </div>
        </div>


        <div class="carousel-item">
            <img src="./Magnolia_grandiflora_-_flower_1.jpg" alt="" height="880px" width="100%">
            <div class="carousel-caption">
                <h2>Wishlist</h2>
            </div>
        </div>

        <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#demo">
            <span class="carousel-control-prev-icon"></span>
        </button>


        <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#demo">
            <span class="carousel-control-next-icon"></span>
        </button>

      </div>
    </section>
</body>
</html>
